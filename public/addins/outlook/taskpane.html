<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=Edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Collie Phish Report</title>
    <script src="https://appsforoffice.microsoft.com/lib/1/hosted/office.js" type="text/javascript"></script>
    <style>
      :root {
        color-scheme: light;
        --collie-navy: rgb(13, 27, 66);
        --collie-cloud: rgb(241, 244, 248);
        --collie-water: rgb(56, 189, 248);
        --collie-line: rgb(13 27 66 / 0.14);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        font-family: "Segoe UI", system-ui, -apple-system, sans-serif;
        color: var(--collie-navy);
        background: #fff;
        height: 100%;
      }
      main {
        padding: 20px 18px;
        display: flex;
        flex-direction: column;
        gap: 16px;
        min-height: 100%;
      }
      header {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .badge {
        width: 36px;
        height: 36px;
        border-radius: 8px;
        background: var(--collie-cloud);
        border: 1px solid var(--collie-line);
        display: grid;
        place-items: center;
        color: var(--collie-navy);
        font-weight: 700;
      }
      h1 {
        font-size: 15px;
        margin: 0;
        font-weight: 600;
        letter-spacing: -0.005em;
      }
      .lede {
        margin: 0;
        font-size: 13px;
        line-height: 1.45;
        color: rgb(13 27 66 / 0.72);
      }
      button#report {
        appearance: none;
        border: 0;
        background: var(--collie-navy);
        color: #fff;
        font-weight: 600;
        font-size: 14px;
        padding: 10px 14px;
        border-radius: 8px;
        cursor: pointer;
        transition: background 120ms ease;
      }
      button#report:hover { background: rgb(13 27 66 / 0.92); }
      button#report:disabled {
        background: rgb(13 27 66 / 0.4);
        cursor: progress;
      }
      .status {
        font-size: 13px;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--collie-line);
        background: var(--collie-cloud);
        line-height: 1.4;
        display: none;
      }
      .status.show { display: block; }
      .status.error { background: rgb(220 38 38 / 0.08); border-color: rgb(220 38 38 / 0.4); color: rgb(127 29 29); }
      .status.success { background: rgb(34 197 94 / 0.08); border-color: rgb(34 197 94 / 0.4); color: rgb(20 83 45); }
      footer {
        margin-top: auto;
        font-size: 11px;
        color: rgb(13 27 66 / 0.55);
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div class="badge" aria-hidden="true">C</div>
        <div>
          <h1>Report this email</h1>
        </div>
      </header>
      <p class="lede">
        Sending this message to your security team will flag it for triage. If it was a Collie
        phishing simulation, your training record will be updated automatically.
      </p>
      <button id="report" type="button">Report email</button>
      <div id="status" class="status" role="status" aria-live="polite"></div>
      <footer>Collie phishing simulation platform</footer>
    </main>
    <script src="taskpane.js" type="text/javascript"></script>
  </body>
</html>
